# Render Blueprint: deploys the portfolio as a free Render Static Site.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    runtime: static
    name: santhosh-kumar-k-portfolio
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    headers:
      # Hashed build assets never change: cache them for a year.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
